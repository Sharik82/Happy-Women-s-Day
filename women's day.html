<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Women's Day</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            position: absolute;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];
        let textParticles = [];
        let heartParticles = [];
        let heartFormed = false;
        let exploded = false;

        function heartShape(t, scale = 15) {
            const x = 16 * Math.pow(Math.sin(t), 3) * scale;
            const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;
            return { x: x, y: -y };
        }

        function createParticles() {
            for (let i = 0; i < 1000; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 3 + 1,
                    targetX: null,
                    targetY: null,
                    color: 'red',
                    velocity: Math.random() * 0.5 + 0.5
                });
            }
        }

        function createTextAndHeartParticles() {
            const text = "Your text...";
            ctx.font = "40px Arial";
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const buffer = imageData.data;
            
            for (let y = 0; y < canvas.height; y += 4) {
                for (let x = 0; x < canvas.width; x += 4) {
                    const index = (y * canvas.width + x) * 4;
                    if (buffer[index + 3] > 128) {
                        textParticles.push({
                            x: Math.random() * canvas.width,
                            y: Math.random() * canvas.height,
                            targetX: x,
                            targetY: y,
                            size: 2,
                            color: 'white',
                            velocity: Math.random() * 0.5 + 0.5
                        });
                    }
                }
            }

            for (let i = 0; i < 40; i++) {
                let scale = Math.random() * 5 + 5;
                let posX = Math.random() * canvas.width;
                let posY = Math.random() * canvas.height;
                let heartPoints = [];
                for (let t = 0; t < Math.PI * 2; t += 0.1) {
                    let pos = heartShape(t, scale);
                    heartPoints.push({
                        x: posX + pos.x,
                        y: posY + pos.y,
                        size: 2,
                        color: 'red'
                    });
                }
                heartParticles.push(heartPoints);
            }
        }

        function moveToContour() {
            particles.forEach((p, i) => {
                let t = (i / particles.length) * Math.PI * 2;
                let pos = heartShape(t * 8);
                p.targetX = pos.x + canvas.width / 2;
                p.targetY = pos.y + canvas.height / 2;
            });
            setTimeout(fillHeart, 4000);
        }

        function fillHeart() {
            particles.forEach((p, i) => {
                let t = Math.random() * Math.PI * 2;
                let pos = heartShape(t * 8 * Math.random());
                p.targetX = pos.x + canvas.width / 2;
                p.targetY = pos.y + canvas.height / 2;
            });
            heartFormed = true;
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                if (p.targetX !== null && p.targetY !== null) {
                    p.x += (p.targetX - p.x) * 0.02 * p.velocity;
                    p.y += (p.targetY - p.y) * 0.02 * p.velocity;
                }
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            if (exploded) {
                textParticles.forEach(p => {
                    p.x += (p.targetX - p.x) * 0.02 * p.velocity;
                    p.y += (p.targetY - p.y) * 0.02 * p.velocity;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                heartParticles.forEach(heart => {
                    heart.forEach(p => {
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    });
                });
            }
            requestAnimationFrame(drawParticles);
        }

        createParticles();
        setTimeout(moveToContour, 2000);
        drawParticles();

        canvas.addEventListener('click', () => {
            if (!exploded) {
                exploded = true;
                particles.forEach(p => {
                    p.targetX = Math.random() * canvas.width;
                    p.targetY = Math.random() * canvas.height;
                    p.velocity = Math.random() * 3 + 1;
                });
                setTimeout(() => {
                    createTextAndHeartParticles();
                }, 5000);
            }
        });
    </script>
</body>
</html>
